name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc), with the npm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies from package-lock.json
        run: npm ci

      - name: Check the API types match the OpenAPI file
        run: |
          npm run generate:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep the built app for download
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
